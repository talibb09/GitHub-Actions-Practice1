# waht is the goal of your workflow
# Goal: Whwnever someone changes the python code 
# The linter will check if the syntax, formate, indentation (linting) the correct or not.

name: Auto Linter

on: 
  push: 
    paths: "*.py"

jobs:
  code-linting:
    runs-on: ubuntu-latest
    steps:
# this step will automatically cone the code of current branch into runner
      - name: checkout/clone the code
        uses: actions/checkout@v7
# This step will setup and install python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
# this step will install linter
      - name: install linter
        run: pip install ruff
# This step will run the linter
      - name: check the files for linting
        run: ruff check .
    
